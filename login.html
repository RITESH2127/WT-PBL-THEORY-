{% extends 'base.html' %}
{% block title %}Login - Smart EMS{% endblock %}

{% block content %}
<div class="auth-wrapper" style="display: flex; align-items: center; justify-content: center; min-height: 70vh;">
    <div class="auth-container glass-panel" style="max-width: 900px; display: flex; flex-direction: row; padding: 0; overflow: hidden; width: 100%; margin: 0; box-shadow: var(--glass-shadow); border-radius: 20px;">
        
        <!-- Left Side: Image/Branding (Hidden on mobile) -->
        <div class="auth-banner" style="flex: 1; background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%); color: white; padding: 3rem 2rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
            <i class="ph-fill ph-calendar-star" style="font-size: 5rem; margin-bottom: 1rem;"></i>
            <h2 style="font-size: 2rem; margin-bottom: 1rem; color: white;">Welcome Back!</h2>
            <p style="font-size: 1.1rem; opacity: 0.9;">Sign in to access your dashboard, discover events, and manage your schedule seamlessly.</p>
        </div>

        <!-- Right Side: Login Form -->
        <div style="flex: 1; padding: 3rem 2.5rem; display: flex; flex-direction: column; justify-content: center;">
            <h2 style="margin-bottom: 1.5rem; color: var(--text-color); font-size: 1.8rem;">Login securely</h2>
            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label for="email" style="font-weight: 600;">Email Address</label>
                    <div style="position: relative;">
                        <i class="ph ph-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.2rem;"></i>
                        <input type="email" id="email" name="email" class="form-control" required placeholder="john@example.com" style="padding-left: 2.8rem;">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password" style="font-weight: 600;">Password</label>
                    <div style="position: relative;">
                        <i class="ph ph-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.2rem;"></i>
                        <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••" style="padding-left: 2.8rem;">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem; padding: 0.75rem; font-size: 1.1rem; border-radius: 10px;">
                    Login
                </button>
            </form>
            
            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--glass-border);">
                <p style="text-align: center; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); margin-bottom: 1rem;">Demo Accounts (Click to fill)</p>
                <div style="display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center;">
                    <button type="button" class="btn" style="background: var(--bg-color); border: 1px solid var(--glass-border); color: var(--text-color); font-size: 0.85rem;" onclick="fillDemo('admin@ems.com', 'admin123')">
                        <i class="ph-fill ph-user-gear" style="color: var(--danger-color);"></i> Admin
                    </button>
                    <button type="button" class="btn" style="background: var(--bg-color); border: 1px solid var(--glass-border); color: var(--text-color); font-size: 0.85rem;" onclick="fillDemo('org@ems.com', 'org123')">
                        <i class="ph-fill ph-users" style="color: var(--secondary-color);"></i> Organizer
                    </button>
                    <button type="button" class="btn" style="background: var(--bg-color); border: 1px solid var(--glass-border); color: var(--text-color); font-size: 0.85rem;" onclick="fillDemo('user@ems.com', 'user123')">
                        <i class="ph-fill ph-user" style="color: var(--primary-color);"></i> User
                    </button>
                </div>
            </div>

            <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
                Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary-color); font-weight: 600;">Create one</a>
            </p>
        </div>
    </div>
</div>

<script>
function fillDemo(email, pass) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
