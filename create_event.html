{% extends 'base.html' %}
{% block title %}Create Event - Smart EMS{% endblock %}

{% block content %}
<div class="glass-panel" style="max-width: 600px; margin: 0 auto; padding: 2rem;">
    <h2 style="color: var(--primary-color); margin-bottom: 1.5rem; text-align: center;">Create New Event</h2>
    
    <form action="{{ url_for('create_event') }}" method="POST">
        <div class="form-group">
            <label for="title">Event Title</label>
            <input type="text" id="title" name="title" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" class="form-control" required style="background: var(--bg-color); color: var(--text-color);">
                <option value="Tech">Tech</option>
                <option value="Business">Business</option>
                <option value="Music">Music</option>
                <option value="Sports">Sports</option>
                <option value="Workshop">Workshop</option>
            </select>
        </div>
        
        <div style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" class="form-control" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="time">Time</label>
                <input type="time" id="time" name="time" class="form-control" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="venue">Venue</label>
            <input type="text" id="venue" name="venue" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="total_seats">Total Seats Available</label>
            <input type="number" id="total_seats" name="total_seats" class="form-control" required min="1">
        </div>
        
        <div class="form-group">
            <label for="image_url">Image URL (Optional)</label>
            <input type="url" id="image_url" name="image_url" class="form-control" placeholder="https://...">
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control" rows="4" required></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
            <i class="ph ph-calendar-plus"></i> Publish Event
        </button>
    </form>
</div>
{% endblock %}
